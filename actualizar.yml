name: Actualizar datos y publicar

on:
  schedule:
    - cron: "30 22 * * 1-5"   # 22:30 UTC = 16:30 hora de Ciudad de México (L-V, después del cierre de la BMV)
  workflow_dispatch: {}        # botón "Run workflow" para correrlo a mano
  push:
    branches: [main]
    paths: ["docs/index.html", "scripts/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install yfinance pandas
      - name: Descargar datos de Yahoo Finance
        run: python scripts/actualizar.py
      - name: Guardar datos en el repositorio
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/data/live.json
          git commit -m "Datos actualizados $(date -u +%F)" || echo "Sin cambios"
          git push || echo "No se pudo hacer push (se publica igual)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
